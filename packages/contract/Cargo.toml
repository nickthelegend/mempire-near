[package]
name = "mempire-arena"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Mempire arena on NEAR: staked 1v1 lane battles refereed on-chain by a Rust port of the deterministic Mempire sim"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.0-rc.1"

[dev-dependencies]
near-sdk = { version = "=5.30.0-rc.1", features = ["unit-testing"] }
near-workspaces = "=0.24.0-rc.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
anyhow = "1"
serde_json = "1"
ed25519-dalek = { version = "2", features = ["rand_core"] }
base64 = "0.22"
rand = "0.8"
bs58 = "0.5"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
